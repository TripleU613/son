; Four processes in one container, in dependency order.
;
; This replaces what Compose used to do across four containers: keep each one
; running, restart the one that died, and keep their logs apart. Doing it here is
; what makes a single image honest -- a bash entrypoint with `wait -n` would take
; the whole container down whenever the browser crashed, and the browser is the
; thing most likely to crash.
;
; Everything runs as pwuser (set by the Dockerfile's USER), so every path supervisor
; writes to is under /tmp -- the container's only writable mount. That is also what
; lets the root filesystem stay read-only in docker-compose.yml.

[supervisord]
nodaemon=true
; PID 1 in the container, so it reaps its own children. Without this, Chromium's
; exited renderers accumulate as zombies until the process table gives out.
user=pwuser
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid
childlogdir=/tmp
; Program output goes to the container's stdout (see each program below), so this
; only carries supervisor's own lifecycle lines.
loglevel=info

; A socket is required for `supervisorctl`, which is the difference between
; restarting one process and restarting the container. In /tmp because nothing here
; runs as root and / is read-only.
[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

; ---------------------------------------------------------------------------
; The site. First to start and the only one that matters for serving traffic:
; screening being down publishes uploads unscreened (deliberately, and logged),
; but the app being down is the site being down.
[program:app]
command=/app/soncollection
directory=/app
priority=10
autostart=true
autorestart=true
startsecs=3
stopwaitsecs=10
; SIGINT rather than SIGTERM: hyper/axum's graceful shutdown listens for it, and
; the default TERM leaves in-flight requests cut off mid-response.
stopsignal=INT
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------------------------------------------------------------------
; Gemini screening. Bound to loopback, not 0.0.0.0: it is reached only from the app
; in this same container now, and it holds a live Google session.
;
; One worker, deliberately. Each GeminiClient holds a conversation-bearing session
; and the service serialises per client with a lock; multiple workers would each
; build their own client pool from the same cookies, multiplying the account's
; concurrent sessions for no throughput gain, since the bottleneck is Gemini.
[program:sidecar]
; /app/venv, not the base image's python: the sidecar's dependencies live in their
; own environment because this image's system Python is Debian-managed and pip
; cannot upgrade its typing_extensions (see the Dockerfile).
command=/app/venv/bin/python -m uvicorn gemini_service:app --host 127.0.0.1 --port 8099 --workers 1
directory=/app
priority=20
autostart=true
autorestart=true
startsecs=5
stopwaitsecs=15
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------------------------------------------------------------------
; The session keeper: Xvfb, a window manager, x11vnc, websockify and an ordinary
; (non-automated) Chromium, then the keeper itself attaching over CDP. The script
; owns that whole stack, so supervisor treats it as one program.
;
; Started last and given the longest grace period: it waits for the sidecar to
; answer before pushing cookies at it, and a browser cold start is seconds, not
; milliseconds. autorestart is what makes this survivable -- a crashed browser used
; to be a restarted container.
[program:keeper]
command=/app/keeper-entrypoint.sh
directory=/app
priority=30
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=20
; The script backgrounds Xvfb, x11vnc, websockify and Chromium, so killing the
; script alone would orphan them. Its own process group gets the signal instead.
killasgroup=true
stopasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

; ---------------------------------------------------------------------------
; The tunnel. Last, because until the app is listening it has nothing to serve, and
; cloudflared retries its origin connection on its own anyway.
;
; --no-autoupdate: the binary is checksum-pinned in the Dockerfile, and a process
; that replaces its own binary at runtime makes the image a lie about what is
; running. Upgrades happen by bumping the pin and rebuilding.
;
; No --token argument. cloudflared reads TUNNEL_TOKEN from the environment, so the
; token never enters any process's argv -- `--token %(ENV_...)s` would have put it
; in cloudflared's own command line, visible to `ps` inside the container for its
; whole lifetime. It also means an absent token is a failed program that supervisor
; reports and retries, rather than a config-parse error that stops the container
; from starting at all (supervisor has no default syntax for a missing ENV_).
[program:cloudflared]
command=cloudflared tunnel --no-autoupdate run
priority=40
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
