name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings so dead code doesn't accumulate in a public repo.
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      # Both halves are checked separately: the two feature sets compile
      # disjoint code, so a green ssr build says nothing about the wasm one.
      - name: clippy (server)
        run: cargo clippy --no-default-features --features ssr -- -D warnings

      - name: clippy (wasm)
        run: >
          cargo clippy --no-default-features --features hydrate
          --target wasm32-unknown-unknown -- -D warnings

      - name: test
        run: cargo test --no-default-features --features ssr

      # The repo is public. There is no .env on a runner, so this pass checks
      # every object in history and every tracked file against the credential
      # shapes rather than against known values -- which is the case that matters
      # here: a contributor (or a future me) committing a real GOCSPX-/g.a000
      # secret. The value-comparison half runs on a machine that has the .env,
      # from the pre-push hook.
      - name: no secret in history or tracked files
        run: scripts/audit-secrets.sh

  # Builds the production image. The Dockerfile's own builder stage runs the
  # real `cargo leptos build --release` -- there used to be a second, separate
  # compile here that produced a raw binary just to throw it away as a 7-day
  # Actions artifact, duplicating the entire Rust build for no reason. This
  # job's image *is* the artifact now: on `main` it's the thing that actually
  # gets deployed, and on a PR it's still built (validating the Dockerfile)
  # but discarded rather than pushed, since a fork PR's restricted token
  # cannot authenticate to the registry anyway.
  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # A digest reference (@sha256:...), not a tag: tags can be moved, even
      # by accident; a digest cannot, so deploy is guaranteed to run exactly
      # what this job built, not whatever ":<sha>" happens to point to later.
      # One image now, so there is no second or third digest that could be
      # mismatched with it. Three of the four outages in this project's history
      # were exactly that: a new app image talking to a stale sidecar or keeper.
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # OCI/Docker tags must be all-lowercase; github.repository preserves the
      # repo's actual case (TripleU613/son), which buildx correctly rejects.
      - name: compute lowercase image repository
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Only pushed on main: a PR build validates the Dockerfile still
          # builds and nothing more.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: resolve image references
        id: ref
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "image=ghcr.io/${{ steps.repo.outputs.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # Deploys the image build() just produced to jtech. Only runs for
  # pushes to main (never for pull_request, including from forks) -- that
  # trigger has no access to secrets, and this job needs several.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only, unlike build's `packages: write`: this job only pulls the
      # image build() already pushed. Needed so GITHUB_TOKEN can authenticate
      # jtech's pull below.
      packages: read
    steps:
      - uses: actions/checkout@v4

      # jtech is reached over the tailnet, not the public internet, and needs no
      # key: it runs Tailscale SSH, so the connecting node's own tailnet identity
      # is the credential and the ACL decides whether it may connect as root.
      # Exactly how bulky-server worked before the move.
      #
      # This replaced an ed25519 keypair over public :22, which broke the moment
      # jtech's operator locked inbound SSH to the tailnet -- correctly, since a
      # public :22 open to GitHub's wide, rotating runner ranges is the vector that
      # lockdown exists to close. Reopening it was the wrong fix.
      #
      # Requires one tailnet ACL grant, and it is not optional: `tag:ci` must be
      # allowed to reach `tag:isolated` on 22 in `acls`, *and* listed in an `ssh`
      # rule with `action: "accept"`. "check" would demand an interactive browser
      # re-auth, which no CI job can satisfy.
      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_CI_AUTHKEY }}
          tags: tag:ci

      - name: pin jtech's host key
        # Committed in deploy/known_hosts, keyed on the tailnet name. The address
        # that had to stay out of this repo was jtech's *public* one -- it fronts
        # unrelated services behind a Cloudflare proxy, and publishing it hands a
        # reader a way around that proxy. A tailnet name and a public host key give
        # nobody anything: the name resolves only inside the tailnet, and a host
        # key is public by construction.
        #
        # Read with `ssh-keyscan` over the tailnet, which needs no authentication,
        # and it matches the key that was previously pinned for the public address
        # byte for byte -- the same sshd host key, so this is a verified pin rather
        # than trust-on-first-use.
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          cat deploy/known_hosts >> ~/.ssh/known_hosts

      - name: deploy
        # Connects with the key loaded in the step above, over the public
        # internet, to the address pinned in deploy/known_hosts.
        #
        # The env list below is the single place a new secret needs adding --
        # both the local export block and the two docker compose commands read
        # from it, so a new variable in docker-compose.yml only needs adding
        # here once, not once per command.
        env:
          # The tailnet name, committed rather than held in a secret.
          #
          # What had to stay out of this repo was jtech's *public* address: it is
          # the origin of a box whose public names all sit behind a Cloudflare
          # proxy, including a Discourse forum unrelated to this project, and
          # publishing it hands any reader a way around that proxy. That reasoning
          # does not extend to a tailnet name, which resolves only inside the
          # tailnet and reaches nothing without a node in it.
          DEPLOY_HOST: jtech
          SON_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
          PSEUDONYMS: ${{ secrets.PSEUDONYMS }}
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          # Google session cookies for the sidecar, psid:psidts per account.
          GEMINI_COOKIES: ${{ secrets.GEMINI_COOKIES }}
          SIDECAR_KEY: ${{ secrets.SIDECAR_KEY }}
        run: |
          # mkdir -p first: the scp below silently required this directory to
          # already exist, which was only true on the previous target because
          # it had been created there by hand. Doing it here means the deploy
          # can stand up a fresh host without manual prep.
          ssh root@$DEPLOY_HOST 'mkdir -p /opt/son'

          scp docker-compose.yml root@$DEPLOY_HOST:/opt/son/docker-compose.yml

          VARS="SON_IMAGE CF_ACCOUNT_ID CF_D1_DATABASE_ID CF_D1_API_TOKEN \
                R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE \
                CF_TUNNEL_TOKEN SESSION_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET \
                ADMIN_EMAILS PSEUDONYMS CF_ANALYTICS_TOKEN GEMINI_COOKIES SIDECAR_KEY"
          # Built as a script on stdin, not as arguments to ssh.
          #
          # These used to be prepended to the remote command line, which puts every
          # secret value in the target's process list for as long as the pull and
          # the `up` take -- readable by anything on the host that can run `ps`. The
          # GHCR token below was already piped for exactly this reason; the other
          # fifteen were not. Over stdin they are set inside the remote shell and
          # `ps` shows `bash -s` and nothing else. printf %q so a value containing
          # a quote or a space cannot end the assignment early.
          remote_script() {
            for v in $VARS; do
              printf 'export %s=%q\n' "$v" "${!v}"
            done
            cat deploy/remote-deploy.sh
          }

          # The image is in a private GHCR package, and the `docker login` the
          # build job did was on the *runner* -- the target pulls it itself
          # and has no credential of its own, which is exactly why every
          # deploy failed with "error from registry: unauthorized" while the
          # build above succeeded. Piped over stdin rather than passed as an
          # argument so the token never lands in the remote process list.
          printf '%s' "$GHCR_TOKEN" \
            | ssh root@$DEPLOY_HOST "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          # `if`, not a bare command, so a failed deploy still reaches the
          # logout below instead of leaving a registry credential sitting in
          # root's ~/.docker/config.json on the server.
          # --remove-orphans is load-bearing on this deploy specifically: the
          # compose file went from four services to one, and without it the old
          # son-app/gemini/keeper/cloudflared containers would keep running
          # alongside the merged one -- two cloudflared processes sharing one tunnel
          # token, which is the "two origins on one tunnel" failure that once had
          # Cloudflare load-balancing between an old and a new stack.
          # `if a | b` takes b's status, and ssh's status is the remote bash's --
          # so a failed pull or a failed `up` still fails this step.
          if remote_script | ssh root@$DEPLOY_HOST 'bash -s'; then
            status=0
          else
            status=$?
          fi

          ssh root@$DEPLOY_HOST 'docker logout ghcr.io' || true
          exit $status
      # No secret value is ever left on the target: the deploy variables are
      # shell-local env vars for exactly the commands above, passed straight
      # through to docker compose's own ${VAR} interpolation and gone when the
      # SSH session ends, and the one credential that does touch disk (the
      # GHCR login) is removed again by the logout above, pass or fail.
