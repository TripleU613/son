name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings so dead code doesn't accumulate in a public repo.
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      # Both halves are checked separately: the two feature sets compile
      # disjoint code, so a green ssr build says nothing about the wasm one.
      - name: clippy (server)
        run: cargo clippy --no-default-features --features ssr -- -D warnings

      - name: clippy (wasm)
        run: >
          cargo clippy --no-default-features --features hydrate
          --target wasm32-unknown-unknown -- -D warnings

      - name: test
        run: cargo test --no-default-features --features ssr

  # Builds the production image. The Dockerfile's own builder stage runs the
  # real `cargo leptos build --release` -- there used to be a second, separate
  # compile here that produced a raw binary just to throw it away as a 7-day
  # Actions artifact, duplicating the entire Rust build for no reason. This
  # job's image *is* the artifact now: on `main` it's the thing that actually
  # gets deployed, and on a PR it's still built (validating the Dockerfile)
  # but discarded rather than pushed, since a fork PR's restricted token
  # cannot authenticate to the registry anyway.
  build:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # A digest reference (@sha256:...), not a tag: tags can be moved, even
      # by accident; a digest cannot, so deploy is guaranteed to run exactly
      # what this job built, not whatever ":<sha>" happens to point to later.
      image: ${{ steps.ref.outputs.image }}
    steps:
      - uses: actions/checkout@v4

      # OCI/Docker tags must be all-lowercase; github.repository preserves the
      # repo's actual case (TripleU613/son), which buildx correctly rejects.
      - name: compute lowercase image repository
        id: repo
        run: echo "name=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: build image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # Only pushed on main: a PR build validates the Dockerfile still
          # builds and nothing more.
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
          tags: |
            ghcr.io/${{ steps.repo.outputs.name }}:${{ github.sha }}
            ghcr.io/${{ steps.repo.outputs.name }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: resolve image reference
        id: ref
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: echo "image=ghcr.io/${{ steps.repo.outputs.name }}@${{ steps.build.outputs.digest }}" >> "$GITHUB_OUTPUT"

  # Deploys the image build() just produced to debiantripleu. Only runs for
  # pushes to main (never for pull_request, including from forks) -- that
  # trigger has no access to secrets, and this job needs several.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Read-only, unlike build's `packages: write`: this job only pulls the
      # image build() already pushed. Needed so GITHUB_TOKEN can authenticate
      # debiantripleu's pull below.
      packages: read
    steps:
      - uses: actions/checkout@v4

      # debiantripleu has no public inbound port at all -- it is reachable only
      # over this tailnet, the same way this runner reaches it to deploy.
      - uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TS_CI_AUTHKEY }}
          tags: tag:ci

      - name: pin debiantripleu's host key
        # Fetched once out-of-band and committed below rather than trusting
        # whatever answers on the IP at deploy time (TOFU inside an automated
        # pipeline is exactly the case host-key checking exists to prevent).
        run: |
          mkdir -p ~/.ssh
          cat deploy/known_hosts >> ~/.ssh/known_hosts

      - name: deploy
        # debiantripleu has Tailscale SSH enabled: the connecting node's tailnet
        # identity IS the credential (see tailnet ACL's "ssh" section), not a
        # keypair -- so no private key is loaded here, only the host-key pin
        # above and this runner's own tag:ci membership from the step before.
        #
        # The env list below is the single place a new secret needs adding --
        # both the local export block and the two docker compose commands read
        # from it, so a new variable in docker-compose.yml only needs adding
        # here once, not once per command.
        env:
          SON_IMAGE: ${{ needs.build.outputs.image }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_D1_DATABASE_ID: ${{ secrets.CF_D1_DATABASE_ID }}
          CF_D1_API_TOKEN: ${{ secrets.CF_D1_API_TOKEN }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ secrets.R2_PUBLIC_BASE }}
          CF_TUNNEL_TOKEN: ${{ secrets.CF_TUNNEL_TOKEN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
        run: |
          # mkdir -p first: the scp below silently required this directory to
          # already exist, which was only true on the previous target because
          # it had been created there by hand. Doing it here means the deploy
          # can stand up a fresh host without manual prep.
          ssh root@debiantripleu 'mkdir -p /opt/son'

          scp docker-compose.yml root@debiantripleu:/opt/son/docker-compose.yml

          VARS="SON_IMAGE CF_ACCOUNT_ID CF_D1_DATABASE_ID CF_D1_API_TOKEN \
                R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY R2_BUCKET R2_PUBLIC_BASE \
                CF_TUNNEL_TOKEN SESSION_SECRET GOOGLE_CLIENT_ID GOOGLE_CLIENT_SECRET"
          EXPORTS=""
          for v in $VARS; do
            EXPORTS="$EXPORTS $v='${!v}'"
          done

          # The image is in a private GHCR package, and the `docker login` the
          # build job did was on the *runner* -- debiantripleu pulls it itself
          # and has no credential of its own, which is exactly why every
          # deploy failed with "error from registry: unauthorized" while the
          # build above succeeded. Piped over stdin rather than passed as an
          # argument so the token never lands in the remote process list.
          printf '%s' "$GHCR_TOKEN" \
            | ssh root@debiantripleu "docker login ghcr.io -u '$GHCR_USER' --password-stdin"

          # `if`, not a bare command, so a failed deploy still reaches the
          # logout below instead of leaving a registry credential sitting in
          # root's ~/.docker/config.json on the server.
          if ssh root@debiantripleu \
               "$EXPORTS docker compose -f /opt/son/docker-compose.yml pull && \
                $EXPORTS docker compose -f /opt/son/docker-compose.yml up -d --remove-orphans"; then
            status=0
          else
            status=$?
          fi

          ssh root@debiantripleu 'docker logout ghcr.io' || true
          exit $status
      # No secret value is ever left on debiantripleu: the deploy variables are
      # shell-local env vars for exactly the commands above, passed straight
      # through to docker compose's own ${VAR} interpolation and gone when the
      # SSH session ends, and the one credential that does touch disk (the
      # GHCR login) is removed again by the logout above, pass or fail.
