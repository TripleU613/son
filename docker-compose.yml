# Deployed on bulky-server. One image, one container, nothing else.
#
# It used to be four containers -- the app, the Gemini sidecar, the session keeper
# and cloudflared -- on a private Compose network. They are now four supervised
# processes inside one image (see Dockerfile and deploy/supervisord.conf), which
# means one thing to build, one thing to pull, one thing to roll back, and one
# version number that describes what is actually running. The old split also had a
# failure mode this cannot have: three of the four outages in this project's history
# were a version skew or a name-resolution failure *between* those containers.
#
# No bind mounts, no named volumes: "no storage on the server" is enforced
# structurally here, not by convention -- there is nowhere in this file a volume
# could even be declared for the app to write application data into. Uploads go to
# R2, all state lives in D1, and the browser profile is archived to R2 as well.
#
# No published port at all. cloudflared runs inside the container and reaches the
# app on 127.0.0.1:3100, so nothing on bulky-server needs an inbound firewall rule
# for web traffic -- matching how the host itself is reachable only over Tailscale.
#
# Every value below except the image reference comes from the calling shell's
# environment, populated by the CI deploy step from GitHub Actions secrets. Nothing
# is written to a .env file on the server or baked into the image -- verified, not
# assumed: scripts/audit-secrets.sh scans the built image's layers and metadata for
# every value in .env and fails if one appears.

services:
  son:
    # Explicit resolvers rather than inheriting the host's. An upload failed with
    # `R2 put ... dispatch failure` while, in the same second, the sidecar could not
    # resolve gemini.google.com -- a transient DNS failure taking out two unrelated
    # things at once. Docker's embedded resolver forwards to whatever the host has,
    # so a wobble there becomes an application error. Everything this talks to is
    # behind Cloudflare anyway.
    dns: [1.1.1.1, 1.0.0.1, 8.8.8.8]
    image: ${SON_IMAGE}
    restart: unless-stopped

    # Still read-only, which is the part of the four-container setup most at risk
    # from merging: the app container had `read_only: true` and the keeper could not,
    # because Chromium writes throughout its profile. It holds because every writer
    # was already pointed at /tmp -- the profile, gemini_webapi's rotated-cookie
    # cache, supervisor's own socket and pid file, and fluxbox's state. Verified by
    # running the merged image with it on rather than by reasoning about it.
    read_only: true

    # One ceiling instead of four. Measured on the four-container deploy immediately
    # before merging, idle: keeper 603MB, sidecar 44MB, app 4MB, cloudflared 26MB
    # (~680MB). The peak that matters is an upload: image decode in the app (bounded
    # by storage::MAX_PIXELS), up to five 12MB bodies spooled to /tmp by the sidecar,
    # and whatever a Google page load costs the browser -- call it ~1.6GB with the
    # tmpfs included, since tmpfs usage counts against this limit.
    #
    # 2g of the host's measured 1.84GB available plus 1.8GB of reclaimable cache.
    # Not the 3g the four separate limits summed to: that was four independent
    # worst cases that never happen at once, and 3g on a 3.8GB box with tor already
    # resident is how this host went dark for ~10 minutes once before. The worst case
    # here is this container being killed, never the box going unreachable.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.5

    # Chrome's default 64MB /dev/shm is what makes it crash on real pages, and this
    # is now the whole container's /dev/shm rather than the keeper's alone.
    shm_size: 256m

    # The only writable path, and it does not survive a restart. exec because
    # Chromium maps files out of its own profile directory; size caps what the
    # browser profile plus in-flight uploads can take out of the limit above.
    tmpfs:
      - /tmp:exec,size=700m

    # The tunnel's ingress is configured in the Cloudflare dashboard (a
    # token-managed tunnel ignores local config), and it points at the old Compose
    # service names. Mapping them to loopback means the merge needed no dashboard
    # change and no window where the origin was unreachable. Safe to drop once that
    # config says http://127.0.0.1:3100.
    extra_hosts:
      - "son-app:127.0.0.1"
      - "gemini:127.0.0.1"
      - "keeper:127.0.0.1"

    environment:
      RUST_LOG: info
      SITE_ORIGIN: https://soncollection.com
      CF_ACCOUNT_ID: ${CF_ACCOUNT_ID}
      CF_D1_DATABASE_ID: ${CF_D1_DATABASE_ID}
      CF_D1_API_TOKEN: ${CF_D1_API_TOKEN}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET}
      R2_PUBLIC_BASE: ${R2_PUBLIC_BASE}
      SESSION_SECRET: ${SESSION_SECRET}
      # Unset until the Google Cloud console OAuth client exists. The app degrades
      # to a sign-in link that redirects with a graceful error rather than failing
      # to start, so this file doesn't wait on that.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      # Comma-separated. Re-checked at every Google login, so this is the source of
      # truth for who is an admin -- see db::upsert_user.
      ADMIN_EMAILS: ${ADMIN_EMAILS:-}
      # email=Display Name pairs, comma-separated, each with an optional
      # |avatar-url. Substituted into the users row at sign-in so the real Google
      # name and picture never reach the database. Unset = everyone is published
      # under the name Google returns.
      PSEUDONYMS: ${PSEUDONYMS:-}
      # Absent -> no analytics script is emitted at all. Cloudflare's edge-side
      # request/bandwidth/threat numbers need nothing here.
      CF_ANALYTICS_TOKEN: ${CF_ANALYTICS_TOKEN:-}
      # psid:psidts pairs, comma-separated for several accounts. The seed a fresh
      # container starts from; the keeper process, or the paste box in /admin,
      # replaces these at runtime without a deploy.
      GEMINI_COOKIES: ${GEMINI_COOKIES}
      GEMINI_TIMEOUT: "120"
      # How many Gemini calls may be in flight at once. Five sessions from one
      # cookie pair, which is only safe because the keeper owns cookie refreshing --
      # two self-refreshing clients on one account invalidate each other's rotating
      # cookie, which is how screening broke earlier.
      GEMINI_CONCURRENCY: ${GEMINI_CONCURRENCY:-5}
      # Lets /admin swap the sidecar's cookies without a redeploy, and authenticates
      # the keeper's pushes to it.
      SIDECAR_KEY: ${SIDECAR_KEY:-}
      # TUNNEL_TOKEN, which is the name cloudflared itself reads, fed from the
      # CF_TUNNEL_TOKEN secret. Passing it as an env var rather than as --token is
      # what keeps it out of the container's process list; see
      # deploy/supervisord.conf.
      TUNNEL_TOKEN: ${CF_TUNNEL_TOKEN}
      # GEMINI_URL / KEEPER_URL / SIDECAR_URL are set in the image to loopback and
      # deliberately not overridable from here: they no longer describe a network
      # topology this file controls.
